services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://construction:construction@db:5432/construction_ai
    depends_on:
      - db

  web:
    build: .
    command: streamlit run production_v2_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg://construction:construction@db:5432/construction_ai
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: construction_ai
      POSTGRES_USER: construction
      POSTGRES_PASSWORD: construction
    volumes:
      - postgres_v2:/var/lib/postgresql/data

volumes:
  postgres_v2:
